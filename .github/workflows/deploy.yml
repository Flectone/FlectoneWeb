name: Deploy Flectone Web

on:
  release:
    types: [ published ]
  push:
    branches:
      - master

jobs:
  deploy:
    if: github.event_name == 'release' || contains(github.event.head_commit.message, '[deploy]')
    runs-on: ubuntu-latest
    steps:
      - name: Build inside LXC 100 and deploy
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          port: ${{ secrets.REMOTE_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            sudo pct exec 100 -- bash -c '
              set -e
              BUILD=/srv/flectone-build
              TARGET=/opt/flectone-web
              mkdir -p /srv

              if [ -d "$BUILD/.git" ]; then
                cd "$BUILD"
                git fetch --depth 1 origin master
                git reset --hard FETCH_HEAD
              else
                rm -rf "$BUILD"
                git clone --depth 1 https://github.com/Flectone/FlectoneWeb.git "$BUILD"
                cd "$BUILD"
              fi

              npm i --no-audit --no-fund
              npm run build

              mkdir -p .next/standalone/.next
              cp -r public .next/standalone/public || true
              cp -r .next/static .next/standalone/.next/static || true
              cp .next/BUILD_ID .next/standalone/.next/ 2>/dev/null || true

              rsync -a --delete .next/standalone/ "$TARGET"/
              chown -R www-data:www-data "$TARGET"
              systemctl restart next-server
            '
